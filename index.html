<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111827" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pitcher Tracker">
    <title>Pitcher Workload Tracker</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
</head>
<body>
    <section id="status" aria-live="polite"></section>

    <section class="availability-section" aria-labelledby="availability-heading">
        <h2 id="availability-heading">Next 7 days</h2>
        <ul id="availability-strip"></ul>
    </section>

    <header>
        <h1>Pitcher Workload Tracker</h1>
        <div class="age-group-control">
            <label for="age-group">Age group</label>
            <select id="age-group">
                <option value="15-16" selected>15-16</option>
                <option value="17-18">17-18</option>
            </select>
        </div>
        <button id="theme-toggle" class="theme-toggle" type="button">
            Use dark mode
        </button>
    </header>

    <section class="counter-section" aria-labelledby="counter-heading">
        <h2 id="counter-heading">Pitch counter</h2>
        <div class="counter-display">
            <span id="count-label">Current pitch count</span>
            <div id="pitch-counter" aria-labelledby="count-label">0</div>
        </div>
        <button id="count-add" class="count-add" type="button">+1</button>
        <div class="counter-actions">
            <button id="count-undo" class="counter-secondary" type="button">
                Undo
            </button>
            <button id="count-save" class="counter-save" type="button">
                Save as outing
            </button>
            <button id="count-reset" class="counter-secondary" type="button">
                Reset
            </button>
        </div>
    </section>

    <section>
        <h2>Log an outing</h2>
        <form id="outing-form">
            <div class="field field-date">
                <label for="date">Date</label>
                <input id="date" name="date" type="date">
            </div>
            <div class="field field-type">
                <label for="type">Type</label>
                <select id="type" name="type">
                    <option value="game">Game</option>
                    <option value="liveBP">Live BP</option>
                    <option value="bullpen">Bullpen</option>
                    <option value="longToss">Long toss</option>
                    <option value="catch">Catch</option>
                </select>
            </div>
            <div class="field field-pitch-count">
                <label for="pitch-count">Pitch count</label>
                <input id="pitch-count" name="pitch-count" type="number" min="1"
                    inputmode="numeric" autocomplete="off">
            </div>
            <div class="field field-effort">
                <label for="effort">Effort</label>
                <input id="effort" name="effort" type="number" min="1" max="10"
                    inputmode="numeric" autocomplete="off" aria-describedby="effort-hint">
                <p id="effort-hint" class="field-hint">
                    1 is easy, 10 is max effort. 9 or 10 adds a rest day.
                </p>
            </div>
            <p id="form-error" aria-live="polite"></p>
            <button type="submit">Log outing</button>
        </form>
    </section>

    <p id="week-total"></p>

    <section>
        <h2>History</h2>
        <button id="export-data" type="button">Export data</button>
        <ul id="history"></ul>
    </section>

    <footer>Based on Pitch Smart guidelines. Not medical advice.</footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
