<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#f4f6f8">
    <title>Pitcher Workload Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <section id="status" aria-live="polite"></section>

    <header>
        <h1>Pitcher Workload Tracker</h1>
        <div class="age-group-control">
            <label for="age-group">Age group</label>
            <select id="age-group">
                <option value="15-16" selected>15-16</option>
                <option value="17-18">17-18</option>
            </select>
        </div>
    </header>

    <section>
        <h2>Log an outing</h2>
        <form id="outing-form">
            <div class="field field-date">
                <label for="date">Date</label>
                <input id="date" name="date" type="date">
            </div>
            <div class="field field-type">
                <label for="type">Type</label>
                <select id="type" name="type">
                    <option value="game">Game</option>
                    <option value="liveBP">Live BP</option>
                    <option value="bullpen">Bullpen</option>
                    <option value="longToss">Long toss</option>
                    <option value="catch">Catch</option>
                </select>
            </div>
            <div class="field field-pitch-count">
                <label for="pitch-count">Pitch count</label>
                <input id="pitch-count" name="pitch-count" type="number" min="1"
                    inputmode="numeric" autocomplete="off">
            </div>
            <div class="field field-effort">
                <label for="effort">Effort</label>
                <input id="effort" name="effort" type="number" min="1" max="10"
                    inputmode="numeric" autocomplete="off" aria-describedby="effort-hint">
                <p id="effort-hint" class="field-hint">
                    1 is easy, 10 is max effort. 9 or 10 adds a rest day.
                </p>
            </div>
            <p id="form-error" aria-live="polite"></p>
            <button type="submit">Log outing</button>
        </form>
    </section>

    <p id="week-total"></p>

    <section>
        <h2>History</h2>
        <ul id="history"></ul>
    </section>

    <footer>Based on Pitch Smart guidelines. Not medical advice.</footer>

    <script type="module" src="js/main.js"></script>
</body>
</html>
