<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f6f8">
    <title>Pitcher Workload Snapshot</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Pitcher Workload Snapshot</h1>
    </header>
    <section aria-labelledby="snapshot-heading">
        <h2 id="snapshot-heading">Shared snapshot</h2>
        <p id="snapshot-message" aria-live="polite">Loading snapshot...</p>
        <dl id="snapshot-details" class="snapshot-details" hidden></dl>
        <div id="snapshot-confirm" hidden>
            <p id="snapshot-confirmation"></p>
            <p id="team-warning" class="share-safety-note" hidden></p>
            <div class="share-actions">
                <button id="add-snapshot" type="button">Add to roster</button>
                <button id="cancel-snapshot" class="counter-secondary" type="button">Cancel</button>
            </div>
        </div>
        <p class="share-safety-note">
            This includes arm health info. Keep it with the coach or team chat it was
            shared with, and follow your team’s parent or coach rules.
        </p>
    </section>
    <section aria-labelledby="team-heading">
        <h2 id="team-heading">Coach team</h2>
        <form id="coach-team-form">
            <label for="coach-team-code">Your team code</label>
            <input id="coach-team-code" type="text" maxlength="12"
                autocapitalize="characters" placeholder="For example, AB-12">
            <button type="submit">Save team code</button>
        </form>
        <p id="coach-team-status" aria-live="polite"></p>
    </section>
    <section aria-labelledby="paste-heading">
        <h2 id="paste-heading">Paste a shared link</h2>
        <label for="snapshot-input">Full link or raw snapshot code</label>
        <textarea id="snapshot-input" rows="4"
            placeholder="Paste a coach link or the code after #"></textarea>
        <button id="load-snapshot" type="button">Preview snapshot</button>
    </section>
    <section aria-labelledby="roster-heading">
        <h2 id="roster-heading">Roster</h2>
        <div id="roster-groups"></div>
    </section>
    <footer>Based on Pitch Smart guidelines. Not medical advice.</footer>
    <script type="module" src="js/coach.js"></script>
</body>
</html>
